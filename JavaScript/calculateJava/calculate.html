<!DOCTYPE html>
<html>
  <head>
    <title>Event Handlers Exercise</title>
  </head>
  <body>
    <div>
      <input type="text" id="num1">
      <input type="text" id="num2">
      <br>
      <button id="add">Addition</button>
      <button id="subtract">Subtraction</button>
      <button id="multiply">Multiplication</button>
      <button id="divide">Division</button>
    </div>
    <p id="result"></p>

    <script>                // find the html id 
        let num1 = document.getElementById("num1"); // find the input boxes
        let num2 = document.getElementById("num2");

        let add = document.getElementById("add"); //find the add button
        let subtract = document.getElementById("subtract");
        let multiply = document.getElementById("multiply");
        let divide = document.getElementById("divide");

        let result = document.getElementById("result");

        add.addEventListener("click", function(){ // when add button is click
            let a = Number(num1.value); // get the first input // number() : change to a number
            let b = Number(num2.value);

            result.textContent = a + b ;  // show the answer
        });
        subtract.addEventListener("click", function(){
            let a = Number(num1.value);
            let b = Number(num2.value);

            result.textContent = a - b ;
        });
        multiply.addEventListener("click", function(){
            let a = Number(num1.value);
            let b = Number(num2.value);

            result.textContent = a * b ;
        });
        divide.addEventListener("click", function(){
            let a = Number(num1.value);
            let b = Number(num2.value);

            result.textContent = a / b ;
        });
    </script>
  </body>
</html>
