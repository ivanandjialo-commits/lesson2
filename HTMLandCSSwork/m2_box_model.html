<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .content-box{
            box-sizing: content-box;
            width: 300px;
            height: 200px;
            padding: 20px;
            border: 5px solid blue;
            border-radius: 20px;
            background-color: lightyellow;
        }
        .border-box{
            box-sizing: border-box;
            width: 250px;
            height: 200px;
            padding: 20px;
            border: 5px solid blue;
            border-radius: 20px;
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h3>Content-box</h3>
        <p>The div uses box-sizing: content-box. The total width 300 + 40px(padding) + 
            10px(border)= 350px
        </p>
    </div>

    <br>
    <div class="border-box">
        <h3>Border-box</h3>
        <p>The div uses box-sizing: content-box. The total width 300 + 40px(padding) + 
            10px(border)= 350px
        </p>
    </div>
</body>
</html>
