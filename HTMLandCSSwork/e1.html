<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .title{
            background-color: lightgrey;
            text-align: center;
            font-size: 25px;
        }
        .red{
            color: red;
        }
        .blue{
            color: blue;
        }
    </style>
</head>
<body>
    <h1 class="title">CSS Application Method</h1> <!-- background and text -->

    <p class="red">This is styled with inline CSS</p> <!-- red text -->
    <p class="blue">This is styled with internal CSS</p> <!-- blue text -->
</body>
</html>
