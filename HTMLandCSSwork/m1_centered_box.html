<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .content-box{
            width: 80%;
            max-width: 600px;
            background-color: lightgray;
            padding: 20px;
            border: 2px solid darkgray;
        }
        h2{
            text-align: center;
        }
        p{
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h2>Centered Content Box</h2>

        <p> This is some placeholder text for the content box. 
            The box is centered horizontally on the page and has a light gray background.
            The paragraph text is justified to make the text look neat and organized.</p>
    </div>
</body>
</html>
