<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        width: 300px;
        border: 1px solid lightgray;
        border-radius: 8px;
        justify-content: center;
        margin: auto;
        overflow: hidden;
      }
      .img-fluid {
        width: 100%;
        display: block;
        border-radius: 8px 8px 0 0;
        box-shadow: none;
      }
      .card-content{
        padding: 15px;
      }
      
    </style>
  </head>
  <body>
    <br />
    <div class="card">
      <img src="https://placehold.co/300x200 " alt="" class="img-fluid"/>
      <div class="card-content">
        <h3>Card title</h3>
        <p>
          This is a styled card with rounded corners created using the
          border-radius property.
        </p>
        <button>Learn More</button>
      </div>
    </div>
  </body>
</html>
