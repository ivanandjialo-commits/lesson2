<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main-title{
            color: blue;
            text-align: center;
        }
        #description{
            color: gray;
            font-size: 18px;
        }
        .btn{
            background-color: green;
            color: white;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid white;
        }
        #special-container{
            background-color: lightgray;
            padding: 20px;
            border: 2px solid black;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="main-title">
        <h1>Welocme to CSS Selector</h1>
    </div>
    <div id="description">
        <p>This is a demonstration of using class and ID Selector in CSS . Class selectors start with dot (.) and ID selectors start with a hash (#).</p>
    </div>
    <button class="btn">Click Me</button>

    <div id="special-container">
        <p>This is a special container styled using an ID selector. ID's should be unique on a page , while classes can be reused.</p>
    </div>
</body>
</html>
