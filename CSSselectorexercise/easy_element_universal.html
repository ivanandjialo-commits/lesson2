<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, sans-serif;
        }
        #element{
            color: red;
            font-size: 32px;
        }
        p{
            color: blue;
            font-size: 16px;
        }
        li{
            margin-bottom: 10px;
        }
        .btn{
            background-color: orange;
            color: white;
            padding: 10px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <h1 id="element">Element and Universal Selectors</h1>

    <p>THis is a first paragraph</p>
    <p>THis is a second paragraph</p>

    <h2>My List</h2>
    <ul>
        <li>First item with bottom margin</li>
        <li>Second item with bottom margin</li>
        <li>Third item with bottom margin</li>
    </ul>

    <button class="btn">Click Me</button>
</body>
</html>
