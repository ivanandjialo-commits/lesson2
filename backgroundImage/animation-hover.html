<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            margin: 60px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightblue;
        }
        .box:hover{
            background-color: lightcoral;
            transition: 1s;
        }
        h1{
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hover me</h1>
    </div>
</body>
</html>
