
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Challenge</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 15px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            background: #70c5ce;
            border: 4px solid white;
            border-radius: 10px;
            max-width: 100%;
        }

        .controls {
            color: white;
            margin-top: 15px;
            line-height: 1.8;
        }

        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>🐤 Flappy Bird Challenge</h1>

    <div class="score-board">
        <span>Score: <span id="score">0</span></span>
        <span>Best: <span id="best">0</span></span>
    </div>

    <canvas id="game" width="400" height="550"></canvas>

    <button id="startBtn">Start Game</button>

    <div class="controls">
        Click / Space to Fly <br>
        Avoid the Pipes!
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const startBtn = document.getElementById("startBtn");

let bird;
let pipes;
let score;
let best = Number(localStorage.getItem("flappyBest")) || 0;

let gravity = 0.35;
let jump = -7;
let gameRunning = false;
let gameOver = false;
let frame = 0;

bestText.textContent = best;

// Bird settings
function createBird() {
    bird = {
        x: 80,
        y: 250,
        size: 22,
        velocity: 0
    };
}

// Start game
function startGame() {

    createBird();

    pipes = [];
    score = 0;
    frame = 0;

    gameRunning = true;
    gameOver = false;

    scoreText.textContent = score;
    startBtn.textContent = "Restart Game";

    drawGame();
}

// Bird movement
function fly() {

    if (gameRunning) {
        bird.velocity = jump;
    }

}

// Create pipes
function createPipe() {

    const gap = 155;

    const topHeight = Math.random() * 200 + 50;

    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
    });

}

// Draw bird
function drawBird() {

    ctx.fillStyle = "#FFD700";

    ctx.beginPath();

    ctx.arc(
        bird.x,
        bird.y,
        bird.size,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Eye
    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(bird.x + 8, bird.y - 7, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(bird.x + 11, bird.y - 7, 3, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "orange";

    ctx.beginPath();
    ctx.moveTo(bird.x + 18, bird.y);
    ctx.lineTo(bird.x + 30, bird.y + 5);
    ctx.lineTo(bird.x + 18, bird.y + 9);
    ctx.fill();

}

// Draw pipes
function drawPipes() {

    ctx.fillStyle = "#228B22";

    pipes.forEach(pipe => {

        // Top pipe
        ctx.fillRect(
            pipe.x,
            0,
            55,
            pipe.top
        );

        // Bottom pipe
        ctx.fillRect(
            pipe.x,
            pipe.bottom,
            55,
            canvas.height - pipe.bottom
        );

        // Pipe borders
        ctx.strokeStyle = "#14532d";
        ctx.lineWidth = 3;

        ctx.strokeRect(pipe.x, 0, 55, pipe.top);
        ctx.strokeRect(
            pipe.x,
            pipe.bottom,
            55,
            canvas.height - pipe.bottom
        );

    });

}

// Collision detection
function checkCollision() {

    if (
        bird.y + bird.size >= canvas.height ||
        bird.y - bird.size <= 0
    ) {
        return true;
    }

    for (let pipe of pipes) {

        if (
            bird.x + bird.size > pipe.x &&
            bird.x - bird.size < pipe.x + 55
        ) {

            if (
                bird.y - bird.size < pipe.top ||
                bird.y + bird.size > pipe.bottom
            ) {
                return true;
            }

        }

    }

    return false;

}

// Game over
function endGame() {

    gameRunning = false;
    gameOver = true;

    if (score > best) {

        best = score;

        localStorage.setItem("flappyBest", best);

        bestText.textContent = best;

    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "bold 35px Arial";
    ctx.fillText("GAME OVER", 200, 240);

    ctx.font = "22px Arial";
    ctx.fillText("Score: " + score, 200, 285);

    ctx.font = "16px Arial";
    ctx.fillText("Press Restart to Play Again", 200, 325);

}

// Main game loop
function drawGame() {

    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ground
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, 530, canvas.width, 20);

    // Bird physics
    bird.velocity += gravity;
    bird.y += bird.velocity;

    // Create pipes
    frame++;

    if (frame % 100 === 0) {
        createPipe();
    }

    // Move pipes
    pipes.forEach(pipe => {

        pipe.x -= 2.5;

        // Score
        if (!pipe.passed && pipe.x + 55 < bird.x) {

            score++;
            pipe.passed = true;

            scoreText.textContent = score;

        }

    });

    // Remove old pipes
    pipes = pipes.filter(pipe => pipe.x > -60);

    drawPipes();
    drawBird();

    if (checkCollision()) {

        endGame();
        return;

    }

    requestAnimationFrame(drawGame);

}

// Controls
canvas.addEventListener("click", fly);

document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();
        fly();

    }

});

startBtn.addEventListener("click", startGame);

</script>

</body>
</html>
