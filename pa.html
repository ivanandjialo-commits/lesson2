<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .container{
            width: 100%;
            padding: 20px 0;
        }
        .card {
            width: 49%;
            height: 49%;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            margin: 40px auto;
        }
        .card-content{
            padding: 20px;
        }
        .card-word{
            color: lightgrey;
        }
        .car-price{
            color: red;
            margin-top: auto;
        }
        .btn{
            width: 100%;
            background-color: black;
            color: white;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 20px;
            margin: auto;
            font-weight: bold;
        }
        .btn-sale{
            width: 25%;
            font-weight: bold;
            background-color: lightgreen;
            color: green;
            border-radius: 20px;
            margin: auto;
            border: #ccc;
            
        }
        .img-fluid{
            width: 100%;
            object-fit: cover;
        }
        .card-year{
            color: lightgray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=680&q=80" alt="" class="img-fluid">
            <div class="card-content">
                <button class="btn-sale">FOR SALE</button>
            <h1>2021 Ford Mustang GT</h1>
            <p class="card-word">Premium . Fashback . VB</p>
            <p>
                One owner, no accidents. Loaded with premium package, Brembo brakes, and active exhaust. 
                Garage kept and meticulously maintained.
            </p>
                <h2>Year</h2>
                <p class="card-year">2021</p>
            <h1 class="car-price">$38,500</h1>
            <button class="btn">Contact Seller</button>
            </div>
        </div>
    </div>
</body>
</html>
