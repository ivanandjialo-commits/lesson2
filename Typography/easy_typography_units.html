<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: lightgray;
            width: 600px;
            padding: 20px;
            margin: auto;
        }
        h2{
            color: gray;
        }
        p{
            font-size: 1rem;
        }
        .highlight{
            background-color: pink;
            color: red;
            font-size: 2em;
        }

</head>
<body>
        <div class="container">
        <h1>Main Heading with Pixels</h1>
        <hr>
        <h2>Subheading with Ems</h2>
        <p>Body text using rems...</p>
        <p>Text with <span class="highlight">highlighted content</span> using ems.</p>
    </div>
</body>
</html>
