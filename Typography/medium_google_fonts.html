<!DOCTYPE html>
<html>
<head>
    <title>Google Fonts Typography Hierarchy</title>
    <!-- Add Google Font imports here -->
    <!-- Load your css file here -->
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body{
            font-size: 1rem;
            line-height: 1.6;
            margin: 2rem;
            color: #222;
        }
        .pull-quote{
            color: purple;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .subtitle{
            color: lightgray;
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 0;
            margin-top: 10px;
        }
        h2, h3, h4{
            font-family: "Merriweather", serif;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        h1{
            font-size: 1.95rem;
            font-weight: 700;
        }
        h2{
            font-size: 1.56rem;
            font-weight: 700;
        }
        h3{
            font-size: 1.25rem;
            font-weight: 400;
        }
        h4{
            font-size: 1rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <article>
        <h1>Main Article Title</h1>
        <p class="subtitle">Article subtitle or introduction</p>
        <p>First paragraph of content...</p>
        
        <h2>First Section Heading</h2>
        <p>More content...</p>
        
        <blockquote class="pull-quote">
            This is an important pull quote from the article
        </blockquote>
        
        <h3>Subsection Heading</h3>
        <p>Additional content...</p>
        
        <h4>Minor Heading</h4>
        <p>Final content section...</p>
    </article>
</body>
</html>
