<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navigation Exercise</title>
    <!-- Load your css file here -->
     <style>
        body{
            margin: 0 auto;
            padding: 0;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        header{
            color: white;
            background-color: #333;
            padding: 40px;
            text-align: center;
        }
        .sticky-nav{
            position: sticky;
            background-color: lightblue;
            top: 0;
        }
        ul{
            list-style: none;
            margin: 0 auto;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        li a{
            display: block;
            color: white;
            text-decoration: none;
            padding: 20px;
            font-size: 20px;
        }
        a:hover{
            background-color: lightgreen;
        }
        .content-section{
            min-height: 100vh;
            margin: 0 auto;
            padding: 30px;
            font-size: 20px;
        }
        footer{
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
        }
        #section1{
            background-color: rgb(169, 236, 236);
        }
        #section2{
            background-color: lightgray;
        }
        #section3{
            background-color: brown;
        }
     </style>
</head>
<body>
    <header>
        <h1>Website Title</h1>
    </header>
    
    <nav class="sticky-nav">
        <ul>
            <li><a href="#section1">Section 1</a></li>
            <li><a href="#section2">Section 2</a></li>
            <li><a href="#section3">Section 3</a></li>
        </ul>
    </nav>
    
    <section id="section1" class="content-section">
        <h2>Section 1</h2>
        <p>Content for section 1...</p>
    </section>
    
    <section id="section2" class="content-section">
        <h2>Section 2</h2>
        <p>Content for section 2...</p>
    </section>
    
    <section id="section3" class="content-section">
        <h2>Section 3</h2>
        <p>Content for section 3...</p>
    </section>
    
    <footer>
        <p>Footer content</p>
    </footer>
</body>
</html>
