<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <h1 class="text-center">Bootstrap Utility Classes</h1>
    <div class="text-center">
        <p class="text-primary fw-bold">This paragraph has blue text, is bold, and is centered</p>
    </div>
    <div class="bg-success">
        <p class="text-white p-3">This paragraph has a green background, white text, and padding size 3.</p>
    </div>

    <div class="bg-secondary">
        <p class="text-end mt-4">This paragraph has a gray background, right-aligned text, and margin-top of size 4.</p>
    </div>
    <div class="text-center">
        <button class="btn btn-primary">Centered button</button>
    </div>

    <div class="bg-light">
        <p class=" shadow p-3">This is div has a box-shadow</p>
    </div>
</body>
</html>
