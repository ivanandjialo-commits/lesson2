<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <form>
        <div class="container">
            <h1 class="text-center">Contact Us</h1>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="name" class="form-control" placeholder="Enter your name">
            </div>
            <br>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>
            <br>
            <div class="form-group">
                <label for="Subject">Subject:</label>
                <input type="subject" class="form-control" placeholder="Enter your subject">
            </div>
            <br>
            <div class="form-group">
                <label for="Message">Message:</label>
                <textarea rows="5" class="form-control" placeholder="Enter your Message"></textarea> 
            </div>
            <br>
            <div class="from-group">
                <label for="">How did you hear about us?</label>
                <select class="form-select">
                    <option>Select your option</option>
                    <option>yes</option>
                    <option>no</option>
                </select>
            </div>
            <br>
            <button class="btn btn-primary">Submit</button>
            <div class="card mt-4 mb-4">
                <div class="card-body">
                    <h3>Contact Information</h3>
                    <p>Address: 123, Main Street, City , Country</p>
                    <p>Phone: + (60) 123-4567</p>
                    <p>Email: primary@gmail.com</p>
                </div>
            </div>
    </form>
</body>
</html>
